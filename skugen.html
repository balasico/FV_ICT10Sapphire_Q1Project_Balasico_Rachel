<!--MAIN CONTENT-->
<div class="container w-50 my-5">
<div class="row bg-light bg-opacity-75 p-3 rounded-2 w-75 mx-auto p-3 text-center">
  
  <h1 class="">Welcome to Skeweererer!<h1>
  <details class="ontoggle fs-6 fw-light">
      <summary>Instructions</summary>
      <p class="">WORK ON PROGRESS</p>
  </details>

<!--SKU Generator-->
<div class="container w-50 my-5" id="fare-matrix">
<div class="row bg-light bg-opacity-75 p-3 rounded-2 mx-auto p-3">
  
  <h1 class="text-center text-dark">SKU Generator</h1>
  <br><br>

  <div class="col-sm mb-4">

    <div class="border rounded-2 p-2 mb-2 d-flex align-items-center justify-content-between">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="bev_id" value="bev">
        <label class="form-check-label fs-6" for="bev_id">Beverage</label>
    </div>
    </div>

    <div class="border rounded-2 p-2 mb-2 d-flex align-items-center justify-content-between">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="topps_id" value="topps">
        <label class="form-check-label fs-6" for="topps_id">Toppings</label>
    </div>
    </div>

    <div class="border rounded-2 p-2 mb-2 d-flex align-items-center justify-content-between">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="bkedgds_id" value="bkedgds">
        <label class="form-check-label fs-6" for="bkedgds_id">Baked Goods</label>
    </div>
    </div>

    <div class="border rounded-2 p-2 mb-2 d-flex align-items-center justify-content-between">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="othr_id" value="othr">
        <label class="form-check-label fs-6" for="other_id">Other</label>
    </div>
    </div>

    
    <label for="productname" class="form-label">Product Name</label>
        <input type="text" class="form-control" id="productname" placeholder="e.g. Bottled Water">
    <br>

    <label for="quantity" class="form-label">Stock Quantity</label>
        <input type="number" class="form-control" id="quantity" placeholder="e.g. 50">

  </div>
  <br>

  <button type="submit" class="btn btn-info" py-click="generate_sku">Generate SKU</button>
  <hr class="my-4">

  <h3 id="X" class="mt-3 fs-6 fw-light text-center">Your generated SKU will appear here.</h3>
    <div id="show-sku"></div>


</div>
</div>
